<main class="app-shell">
  
  <app-todo-header [title]="title"></app-todo-header>

  <section class="todo-workspace">

    <app-todo-input (addTodo) = "add($event)"></app-todo-input>

    <app-todo-footer
    [activeCount]="activeCount()"
    [completedCount]="completedCount()"
    [nowStatus]="nowStatus()"
    (statusChange)="changeStatus($event)"
    (deleteCompleted)="deleteCompleted()"
    ></app-todo-footer>

    <app-todo-list
      [todoList] = "filterTodoList()"
      [allCompleted] = "allCompleted"
      (changeAllCheckbox) = "changeAllCheckbox()"
      (toggleTodo) = "changeCheckbox($event)"
      (deleteTodo) = "delete($event)"
      (updateTodo)="update($event.id,$event.value)"
      (cancelUpdateTodo)="cancelUpdate($event)"
      (editTodo)="edit($event)"></app-todo-list>

  </section>

</main>
